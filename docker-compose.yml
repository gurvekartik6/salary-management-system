services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    command: ["mongod", "--auth"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:?Set MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?Set MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: sggs_salary_notifications
      MONGO_APP_USERNAME: ${MONGO_APP_USERNAME:?Set MONGO_APP_USERNAME}
      MONGO_APP_PASSWORD: ${MONGO_APP_PASSWORD:?Set MONGO_APP_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/10-create-app-user.js:ro
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 20s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 20s
      timeout: 5s
      retries: 5
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      MONGODB_URI: mongodb://${MONGO_APP_USERNAME}:${MONGO_APP_PASSWORD}@mongo:27017/sggs_salary_notifications?authSource=sggs_salary_notifications
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PRIVATE_UPLOAD_DIR: /app/server/private-uploads
      PRIVATE_REPORT_DIR: /app/server/private-reports
      PUBLIC_ASSET_DIR: /app/server/public-assets
      BACKUP_DIR: /app/private-backups
      TRUST_PROXY: "true"
      MONGO_ROOT_USERNAME: ""
      MONGO_ROOT_PASSWORD: ""
      MONGO_APP_USERNAME: ""
      MONGO_APP_PASSWORD: ""
      REDIS_PASSWORD: ""
      ADMIN_BOOTSTRAP_PASSWORD: ""
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - uploads_data:/app/server/private-uploads
      - reports_data:/app/server/private-reports
      - assets_data:/app/server/public-assets
      - backups_data:/app/private-backups
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 6s
      start_period: 60s
      retries: 3
volumes:
  mongo_data:
  redis_data:
  uploads_data:
  reports_data:
  assets_data:
  backups_data:
